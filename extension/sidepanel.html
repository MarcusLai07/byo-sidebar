<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumen</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="skills-wrap">
      <button id="skills-btn" class="icon" title="Skills" aria-label="Skills" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11 2.5 4.5 11H10l-1 6.5L15.5 9H10z"/></svg>
      </button>
    </div>
    <!-- The hidden select keeps the chosen model; the button and menu are what you see. -->
    <select id="model" hidden aria-hidden="true" tabindex="-1"></select>
    <button id="model-btn" class="model-btn" type="button" aria-haspopup="listbox" aria-expanded="false" title="Model">
      <span id="model-label">No model</span>
      <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
    </button>
    <button id="new-chat" class="icon" title="New chat" aria-label="New chat">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16h9a1.5 1.5 0 0 0 1.5-1.5V11"/><path d="M14.2 3.3a1.3 1.3 0 0 1 1.9 1.9L10 11.3 7.5 12l.7-2.5z"/></svg>
    </button>
    <button id="history-btn" class="icon" title="Chat history" aria-label="Chat history">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg>
    </button>
    <button id="prs-btn" class="icon" title="Pull requests" aria-label="Pull requests">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="6" cy="5" r="1.8"/><circle cx="6" cy="15" r="1.8"/><circle cx="14" cy="15" r="1.8"/><path d="M6 6.8v6.4M14 13.2V8a2 2 0 0 0-2-2H9.5M11 4.2 9.3 6 11 7.8"/></svg>
      <span id="prs-badge" class="badge" hidden></span>
    </button>
    <button id="ext-btn" class="icon" title="Manage extensions" aria-label="Manage extensions">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 3.5a1.7 1.7 0 0 1 3.4 0V5H14a1 1 0 0 1 1 1v2.6h-1.4a1.7 1.7 0 0 0 0 3.4H15V15a1 1 0 0 1-1 1h-2.6v-1.4a1.7 1.7 0 0 0-3.4 0V16H5a1 1 0 0 1-1-1v-3h1.5a1.7 1.7 0 0 0 0-3.4H4V6a1 1 0 0 1 1-1h3z"/></svg>
    </button>
    <button id="info-btn" class="icon" title="Models, skills & guide" aria-label="Models, skills and guide">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 9v5M10 6.2v.1"/></svg>
    </button>
  </header>
  <!-- Outside the header: a menu inside a backdrop-filtered parent composites badly. -->
  <div id="skills-menu" class="dropdown" role="menu"></div>
  <div id="model-menu" class="dropdown model-menu" role="listbox" aria-label="Models"></div>

  <section id="history-view" class="view" hidden>
    <input id="history-search" type="search" placeholder="Search chats…" autocomplete="off">
    <div id="history-list"></div>
  </section>

  <section id="info-view" class="view" hidden></section>

  <section id="extensions-view" class="view" hidden>
    <div class="ext-head">
      <input id="ext-search" type="search" placeholder="Search extensions…" autocomplete="off">
      <span id="ext-count" class="hint"></span>
    </div>
    <div id="ext-list"></div>
    <div class="ext-foot">
      <button id="ext-page">All extension settings <span class="ne">↗</span></button>
      <button id="ext-store">Get more <span class="ne">↗</span></button>
    </div>
  </section>

  <section id="prs-view" class="view" hidden>
    <div class="ext-head">
      <strong class="prs-title">Pull requests</strong>
      <span id="prs-updated" class="hint"></span>
      <button id="prs-refresh" class="refresh" title="Check GitHub now" aria-label="Check GitHub now">↻</button>
    </div>
    <div id="prs-list"></div>
    <div id="prs-settings" class="prs-settings"></div>
  </section>

  <section id="media-view" class="view" hidden>
    <div class="media-head">
      <span class="media-title"><strong id="media-count">Media on this page</strong>
        <button id="media-refresh" class="refresh" title="Scan the page again (for images that were still loading)" aria-label="Scan again">↻</button></span>
      <div class="media-filter" role="tablist">
        <button data-kind="all" class="on">All</button>
        <button data-kind="image">Images</button>
        <button data-kind="video">Videos</button>
      </div>
    </div>
    <div id="media-grid" class="media-grid"></div>
    <div class="media-actions">
      <button id="media-select-all">Select all</button>
      <button id="media-attach">Attach to chat</button>
      <button id="media-download" class="primary">Download</button>
    </div>
  </section>

  <main id="messages">
    <div class="empty" id="empty">
      <p>Ask anything about the page you're on.</p>
      <p class="hint">Pick a skill with <span class="kbd-icon">⚡</span> or type <kbd>/</kbd>. Type <kbd>@</kbd> to add tabs.</p>
    </div>
  </main>

  <div id="banner" class="banner" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <section id="media" hidden>
    <div id="media-list"></div>
  </section>

  <footer>
    <div class="composer-card">
    <div id="chips" class="context-row">
      <button id="context-chip" class="chip" title="Include the current tab in your next message">
        <img id="context-icon" alt="">
        <span id="context-title">No tab</span>
      </button>
    </div>
    <div id="popover" class="popover" role="listbox" hidden></div>
    <div id="attach-menu" class="popover" hidden></div>
    <div id="edit-note" class="edit-note" hidden>Editing a message: sending replaces it and everything after. <button id="cancel-edit">Cancel</button></div>
    <form id="composer">
      <button type="button" id="attach" class="icon" title="Attach a file, screenshot or download" aria-label="Attach">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m15.5 9.5-5.6 5.6a3.5 3.5 0 0 1-5-5l6-6a2.3 2.3 0 0 1 3.3 3.3l-6 6a1.2 1.2 0 0 1-1.7-1.7l5.5-5.5"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="Ask, / for skills, @ for tabs" autofocus></textarea>
      <button type="button" id="mic" class="icon" title="Voice input" aria-label="Voice input">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7.5" y="3" width="5" height="9" rx="2.5"/><path d="M5 10a5 5 0 0 0 10 0M10 15v2.5"/></svg>
      </button>
      <button id="send" type="submit" title="Send" aria-label="Send">↑</button>
    </form>
    </div>
    <input id="file-input" type="file" multiple hidden accept="image/*,application/pdf,text/*,.md,.csv,.json">
  </footer>

  <script src="media.js"></script>
  <script type="module" src="panel/main.js"></script>
</body>
</html>
