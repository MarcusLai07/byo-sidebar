<!doctype html>
<html><head><meta charset="utf-8"><title>Media strip harness</title><link rel="stylesheet" href="../extension/sidepanel.css"></head>
<body style="max-width:400px;border:1px solid #ccc">
<main id="messages"><p style="color:#888">(chat area)</p></main>
<section id="media" hidden><div id="media-list"></div></section>
<footer><div id="composer" style="padding:8px">Ask another question...</div></footer>
<audio id="a" loop></audio>
<script>
// 30s quiet tone as a WAV blob so the element has a real, finite duration.
(function(){const sr=8000,n=sr*30,b=new ArrayBuffer(44+n*2),v=new DataView(b);const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.sin(i/sr*2*Math.PI*220)*300,true);document.getElementById("a").src=URL.createObjectURL(new Blob([b],{type:"audio/wav"}));})();
navigator.mediaSession.metadata=new MediaMetadata({title:"Harness Tone",artist:"Test Artist"});
window.__mediaTabs = location.search.includes("discover") ? [] : [1];
if (location.search.includes("discover")) document.getElementById("a").currentTime = 5;
const tab={id:1,audible:true,url:"https://www.youtube.com/watch?v=x",title:"Tab title",favIconUrl:"",mutedInfo:{muted:false},windowId:1};
window.log=[];
window.chrome={
  // ?discover: start with no remembered tabs and an already-played (paused) track.
  storage:{session:{get:async()=>({mediaTabs:window.__mediaTabs}),set:async(o)=>{window.__mediaTabs=o.mediaTabs;window.__onSession?.({mediaTabs:{newValue:o.mediaTabs}});},onChanged:{addListener(f){window.__onSession=f;}}}},
  tabs:{query:async(q)=>(q&&q.audible?[]:[tab]),get:async()=>tab,update:async(id,u)=>{log.push(["tabs.update",u]);if("muted"in u)tab.mutedInfo.muted=u.muted;},onUpdated:{addListener(){}},onRemoved:{addListener(){}}},
  windows:{update:async(...a)=>log.push(["windows.update",a])},
  scripting:{executeScript:({func,args=[]})=>{
    // Like the real API: arguments must be JSON-serializable, or it throws synchronously.
    if (args.some((a)=>a===undefined)) throw new TypeError("Error at parameter 'injection': Value is unserializable.");
    return Promise.resolve([{frameId:0,result:func(...args)}]);}},
};
</script>
<script src="../extension/media.js"></script>
</body></html>
